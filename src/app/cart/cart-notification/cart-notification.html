<div class="notification-container">
  <mat-icon
  class="success-icon"
  [class.remove-icon]="data.action === 'remove'"
>
  check_circle
</mat-icon>

<h2 mat-dialog-title>
  {{ data.action === 'add' ? 'Success!' : 'Removed!' }}
</h2>

<mat-dialog-content>
  <div class="notification-message">
    {{ data.message }}
  </div>

  <button matButton class="addToCart-button" (click)="closeDialogBox()">Ok</button>
</mat-dialog-content>
</div>
